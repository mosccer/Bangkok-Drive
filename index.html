<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101319" />
    <meta name="description" content="Open-world arcade driving through Bangkok: temples, cafés, races and friends." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BKK Drive" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>MOSGAME Bangkok Drive</title>
    <style>
      /* Loading screen: inlined so it shows before the game bundle arrives. */
      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 16px;
        overflow: hidden;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(ellipse at 50% 120%, #f59e0b 0%, #db2777 28%, #4c1d95 56%, #0b1020 82%);
        transition: opacity 450ms ease, visibility 450ms;
      }
      .loading-screen.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loading-screen.warp {
        background: rgba(8, 12, 22, 0.72);
        backdrop-filter: blur(6px);
      }
      .loading-screen.warp .loading-skyline,
      .loading-screen.warp .loading-sub,
      .loading-screen.warp h1 {
        display: none;
      }
      .loading-skyline {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 42vh;
        min-height: 180px;
        opacity: 0.9;
      }
      .loading-card {
        position: relative;
        width: min(460px, 100%);
        padding: 24px 22px 20px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 14px;
        background: rgba(11, 14, 22, 0.72);
        backdrop-filter: blur(10px);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      .loading-card h1 {
        margin: 0;
        font-size: clamp(22px, 5vw, 30px);
        font-weight: 900;
        letter-spacing: 0.02em;
      }
      .loading-card h1 span {
        display: block;
        color: #f8d95a;
      }
      .loading-sub {
        margin: 6px 0 18px;
        color: #cbd5e1;
        font-size: 14px;
      }
      .loading-road {
        position: relative;
        height: 30px;
        margin: 0 4px;
      }
      .loading-car {
        position: absolute;
        bottom: 6px;
        left: 0;
        font-size: 22px;
        transform: translateX(-50%) scaleX(-1);
        transition: left 300ms ease;
      }
      .loading-bar {
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .loading-bar i {
        display: block;
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #22d3ee, #f8d95a, #f472b6);
        transition: width 300ms ease;
      }
      .loading-status {
        min-height: 20px;
        margin: 12px 0 4px;
        font-size: 14px;
        font-weight: 700;
      }
      .loading-tip {
        min-height: 36px;
        margin: 8px 0 0;
        color: #a5b4c8;
        font-size: 12px;
      }
      .loading-error {
        color: #fecaca;
      }
      .loading-retry {
        margin-top: 12px;
        height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 8px;
        background: #f8d95a;
        color: #1c1204;
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-screen,
        .loading-bar i,
        .loading-car {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
      <svg class="loading-skyline" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
        <path fill="#1e1b3a" d="M0 300V190h40v-40h30v60h40v-90h26v-30h14v30h26v120h36v-70h50v80h30v-150l20-30 20 30v150h34v-60h60v90h24v-120h46v130h30l20-60 12-50 12 50 20 60h40v-100h40v70h30v-140h24v-24h8v24h24v160h40v-60h50v90h26v-110h40v120h34v-80h60v100h30V300z" />
        <path fill="#0f0d24" d="M0 300V240h60v-30h40v50h60v-40h50v60h40v-70h30l16-40 16 40h30v60h60v-40h40v50h50v-60h40v70h60v-50h50v40h40v-60h36v70h60v-40h50v50h40v-70h40v80h50v-50h40v60h60V300z" />
      </svg>
      <div class="loading-card">
        <h1>MOSGAME <span>Bangkok Drive</span></h1>
        <p class="loading-sub">ขับรถตะลุยกรุงเทพฯ · วัด คาเฟ่ ตึกระฟ้า และเพื่อน&nbsp;ๆ</p>
        <div class="loading-road"><span class="loading-car" id="loading-car">🚕</span></div>
        <div class="loading-bar"><i id="loading-fill"></i></div>
        <p class="loading-status" id="loading-status">กำลังโหลดเกม…</p>
        <p class="loading-tip" id="loading-tip">เคล็ดลับ: กด N เพื่อเปิดแผนที่ แล้วแตะที่ใดก็ได้เพื่อปักหมุด</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
